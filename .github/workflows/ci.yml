name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version minimale supportée (package.json « engines ») et version de l'image Docker
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Vérification de la syntaxe
        run: for f in server/*.js public/*.js test/*.js; do node --check "$f"; done
      - name: Tests
        run: npm test

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construction
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bernard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrage et contrôle de santé
        run: |
          docker run -d --name bernard -p 3000:3000 bernard:ci
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/state > /dev/null
          docker exec bernard node server/reset-password.js
          docker logs bernard
          test "$(docker inspect -f '{{.State.Running}}' bernard)" = "true"
