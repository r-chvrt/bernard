<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Connexion · Bernard</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <script src="login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-wrap">
    <form id="login-form" class="login-card" novalidate>
      <img src="icon.svg" alt="" width="56" height="56">
      <h1>Bernard</h1>
      <p class="hint">Stock du foyer — saisissez le mot de passe pour continuer.</p>
      <input type="text" name="username" autocomplete="username" value="bernard" hidden>
      <label class="field">
        <span class="sr-only">Mot de passe</span>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required autofocus>
      </label>
      <p class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary">Se connecter</button>
      <p class="login-help">Mot de passe oublié ? Consultez la section « Mot de passe » du README.</p>
    </form>
  </main>
</body>
</html>
