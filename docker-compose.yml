services:
  bernard:
    build: .
    image: bernard:latest
    container_name: bernard
    restart: unless-stopped
    ports:
      - "${BERNARD_PORT:-3000}:3000"
    environment:
      # Fuseau horaire par défaut (modifiable ensuite dans Paramètres).
      TZ: ${TZ:-Europe/Paris}
      # Facultatif : webhook Discord défini ici plutôt que dans l'interface.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - bernard-data:/data
    # Ressources modestes : ~40 Mo de RAM en fonctionnement normal.
    mem_limit: 256m

volumes:
  bernard-data:
